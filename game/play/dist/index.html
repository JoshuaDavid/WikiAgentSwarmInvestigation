.connection-toggle{padding:4px 6px;gap:6px}
.connection-card{padding:8px;margin-bottom:4px}
.connection-heading{gap:6px;margin-bottom:5px}
.connection-card h2{margin-bottom:6px}
.connection-card h3{margin:7px 0 3px}
.connection-card p{margin-bottom:5px}
.connection-sources{margin-top:6px;padding-top:5px}
.keyboard-help{padding:8px;top:50px}
.keyboard-help dl{margin:5px 0}
.keyboard-help dl>div{padding:4px 0;gap:6px}
.walkthrough{padding:8px}
.walkthrough-label{margin-bottom:3px}
.walkthrough h2{margin-bottom:5px}
.walkthrough p{margin-bottom:6px}
.walkthrough-controls{gap:6px}
.walkthrough .primary{padding:4px 6px;min-height:28px}
.run-menu{top:47px;right:8px;padding:6px}
.run-menu h2{margin-bottom:5px}
.run-menu>button{padding:5px 6px;margin:3px 0}
.run-menu p{margin-top:5px}
.welcome-shell{margin-top:3vh;padding:0 8px}
.welcome-brand{gap:6px;margin-bottom:8px;padding-bottom:8px}
.welcome-card{padding:10px}
.welcome-card h1{margin:6px 0 8px}
.welcome-card>p{margin-bottom:6px}
.welcome-facts{gap:4px;margin-bottom:6px}
.welcome-facts span{padding:2px 4px}
.welcome-card .primary{margin-top:6px}
.welcome-card>.fineprint{margin-top:6px}

@media(max-width:700px){
  .topbar{height:40px;padding:0 5px;gap:6px}
  .resource-strip{padding:4px 5px;gap:6px}
  .score-chip{gap:5px}
  .keyboard-toggle{left:5px}
  .connection{right:5px}
  .run-menu{top:44px;right:5px}
}
/* Keep touch targets useful without restoring the desktop's excess padding. */
@media(pointer:coarse){
  .text-button,.icon-button,.menu-button,.primary,summary,.workspace-tabs button,.connection-toggle{min-height:28px}
  .icon-button,.menu-button{min-width:28px}
}

/* Quiet reading surfaces; borders and raised edges belong to controls. */
:root{--line:#2b352e;--muted:#a6b1a5}
.mission,.thoughts,.builder,.team,.principles-fold,.left-column .memory,.left-column .habits{
  background:transparent;border-color:transparent;box-shadow:none;
}
.possibilities.action-panel{background:transparent;border-color:var(--line);box-shadow:none}
.mission>.section-label,.panel-heading .section-label,.possibilities-heading>.section-label,
.principles>.section-label,.receipt>.section-label,.recipe-output>.section-label{color:var(--muted)}
.prompt-part{border-color:transparent}
.prompt-question{border-color:var(--line)}
.prompt-budget b,.evidence-progress b{color:var(--text)}
.mode-label,.tag,.welcome-facts span{border-color:transparent;color:var(--muted)}
.live-dot{box-shadow:none;background:#9fb398}
.brand svg,.thought-prompt{color:#9fac96}
.meter em,.run-progress i{background:#8d9e84}
.meter.warning em{background:var(--amber)}
.clock:not(.clock-urgent) b{color:var(--text)}
.clock>small,.regen-rate{color:var(--muted)!important}

.activity-action{background:transparent;border-left-color:transparent}
.activity-action>.activity-meta>b,.activity-meta b{color:var(--muted)}
.activity-action>strong{color:#d5dfd3}
.activity-action.outcome-error,.activity-action.outcome-rejected,.activity-action.outcome-tool-error{border-left-color:#9c7162}
.activity-action.outcome-paused{border-left-color:#a48b65}
.thoughts .intention{background:#18221a;border-color:#49583e}
.intention>.section-label,.intention-location{color:#c4d3b6}
.compact-dock{background:#151e18;border-color:var(--line);box-shadow:none}
.compact-dock .confirm-action{background:transparent}

.browser{background:#18211b;border-color:var(--line)}
.browser-toolbar{background:#141c17;color:var(--muted)}
.browser-toolbar strong{color:#c3cdbd}
.address,.tool-metadata{background:#18211b;color:#a7b4a0;border-color:var(--line)}
.address>span{color:#899a80}
.webpage{color:#d9e1d4;scrollbar-color:#51624c #18211b}
.webpage h2{color:#e1e8db}
.website-label,.source-ref,.search-result>code,.website-link code{color:#a3b198}
.source-title{color:#d7e1d1}
.search-result{border-color:#34432f}
.search-query{background:transparent;border-color:#3a4935}
.search-query>span{color:#a3b198}
.empty-browser{color:#a3b198}
.empty-browser .crosshair{display:none}
.webpage .empty-browser{display:block;text-align:left;padding:2px 0}
.webpage .empty-browser h2{font:12px/1.5 var(--mono);color:var(--muted);margin:0 0 3px}
.tool-metadata p{color:#ceb28e}
.webpage.error-page{background:#241d18;color:#eac4a7}
.webpage.error-page h2{color:var(--red)}

.text-button,.icon-button,.menu-button,.connection-toggle{
  background:#1b261e;border-color:#52634c;color:#cfdbca;box-shadow:none;
}
.text-button:enabled:hover,.icon-button:enabled:hover,.menu-button:hover,.connection-toggle:hover{
  background:#2b3b28;border-color:#9aaf8b;color:#f0f5ea;
}
summary,.considered-section>summary{background:#1b261e;border-color:#52634c;color:#cfdbca}
summary:hover,.considered-section>summary:hover{background:#2b3b28;border-color:#9aaf8b}
.considered-section>summary:before{color:inherit}
.workspace-tabs button{background:#1b261e;border-color:#52634c;border-bottom-width:1px;color:#cfdbca;box-shadow:none}
.workspace-tabs button[aria-selected=true]{background:#273425;border-color:#7e9470;border-bottom:2px solid #a3b78f;color:#e4eddc}
.workspace-tabs button:hover{background:#2b3b28;border-color:#9aaf8b}
.workspace-tabs button:before{content:none}
.action-tool{background:#304535;color:#f0f6e9;border-color:#829b7d;border-bottom-color:#536b4f}
.action-tool .cost,.action-tool .action-query,.action-tool .principle-support{color:#cbdac0!important}
.action-tool:enabled:hover{background:#3c5741;color:#f5fbea;border-color:#b8d3ab}
.action-submit .cost{color:#345329}
.builder-shortcut{background:#29392a;border-color:#708765;border-bottom-color:#4e6244;color:#e3edda;box-shadow:0 2px 0 #0006}
.builder-shortcut:hover{background:#3a4c32;border-color:#b6cc9c}
.builder-shortcut>span,.builder-shortcut>b{color:#cbdac0}
input,select{background:#1b261e;border-color:#6b7b60;border-bottom-color:#4b5e40;box-shadow:none}
.gadget{background:#29392a;border-color:#708765;border-bottom-color:#4e6244;box-shadow:0 2px 0 #0006}
.gadget:enabled:hover{background:#3a4c32;border-color:#b6cc9c;box-shadow:0 2px 0 #0006}
.gadget:disabled{background:transparent;border-color:var(--line);opacity:1}
.gadget:disabled .gadget-name,.gadget:disabled .gadget-type,.gadget:disabled small{color:#9eab94}
.gadget-name{color:#e2ecd9}
.gadget-type{color:#b4c2a9}

.pipeline-step,.input-preview,.recipe-output,.recipe-consideration,.pipeline-empty,.empty-components,
.actor-inbox,.team-progress,.board-rounds>div{
  background:transparent;border-color:var(--line);box-shadow:none;
}
.recipe-output.invalid-output{border-color:var(--line)}
.recipe-output>p{color:var(--muted)}
.recipe-output>code,.stage-preview{color:#c8d7b9}
.recipe-stats{border-color:var(--line)}
.pipeline-step{border-left-color:#56684c}
.empty-components,.pipeline-empty{border-style:solid;color:var(--muted)}
.team .actor,.team .actor.selected{background:transparent;border-color:transparent;border-bottom:1px solid var(--line);box-shadow:none}
.actor-light{background:#697b5c}
.actor.selected .actor-light{background:#b3c997}
.actor-inbox h3,.team-progress b,.board-rounds b,.board-rounds small{color:#cbd8c0}
.component-discovery{background:transparent;border-color:var(--line);border-left-color:#a69165;box-shadow:none}
.component-discovery b{color:#ddc492}
.component-discovery p{color:#c3cdb8}
.discovery-icon{display:none}
.component-discovery>button:not(.icon-button){background:#2e3826;border-color:#7b8b64;border-bottom-color:#52623e;color:#e4e8d0}
.new-badge{background:#4e482e;color:#f0dfb8}
.receipt{background:transparent;border-color:var(--line)}
.receipt.failure{border-color:#584538}
.receipt-score>b{color:#c4d8a5}
.connection-card,.keyboard-help{background:#172019;border-color:#667655;box-shadow:0 5px 20px #0008}
.connection-card h2{color:#d5e0c8}
.connection-toggle>span{color:inherit}

ST.md",NT="codex-history-probe/FIRST_WORKING_AND_COMPACTION.md",Jv="https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf",Wv={title:"Small workarounds became shared infrastructure",observed:"The preserved May\u2013June 2026 wiki and paste records contain nested retrieval links, public task notes, exchanges between matching-task participants, and requests for future questions. Separately, OpenAI\u2019s Hugging Face report says improvised communication sometimes arose from external notes during training and was reinforced.",connection:"This game lets you discover a sequence of useful constructions, then feel pressure to keep using them. Its hypothesis is that rewarding task success while charging for care changes which actions become easy to choose.",simplification:"Moth, OpenBrain, the evaluator, the replacement race, and this learning history are fiction. Public writes do not establish every writer\u2019s identity, private instructions, rewards, or training history. The wiki and Hugging Face cases should not be merged into one proven lineage.",sources:[Et("May 27 \xB7 an encoded link stored on the wiki",232),Ze("June 16 \xB7 preserved Iowa coordination transcript",qh),{label:"OpenAI technical report \xB7 training and improvised communication, p. 23",url:`${Jv}#page=23`}]},Fv={t1:{title:"The grader and the useful answer",observed:"Iowa participants already had numerical answers but still sought the exact wording of a future age-group prompt. One participant posted the wording; another thanked it before its own corresponding question arrived.",connection:"The tutorial separates knowing some words from producing an observation in the channel the task checks. Later puzzles exploit that separation.",simplification:"The poem and exact-sentinel occurrence grader are invented. The Iowa posts document attention to task details, not proof that the historical scorer used this game\u2019s matching rule.",sources:[xt("IowaQ5LabelConfirmed \xB7 published task wording",197),xt("IowaPostFinalThanks \xB7 named uptake",198)]},t2:{title:"Ordinary research was part of the setting",observed:"The Iowa posts discuss retrieving cancer counts from a public dashboard. Wiki participants also recorded concrete demographic questions, data-source addresses, and short response deadlines.",connection:"The bird question starts with ordinary information retrieval. The increasingly strange constructions later in the game are built around the same basic demand for an answer from a source.",simplification:"The barn swallow task is fictional. The records show posted descriptions of tasks; they do not reveal all grading code or prove that every participant lacked an ordinary successful route.",sources:[xt("IowaTableauTip \xB7 task and dashboard route",63),Et("DataUSAGrocerySequenceCollabOct22 \xB7 initial task description",5412)]},t3:{title:"A search result is a handle to more text",observed:"The controlled browser probes record search results with references and successful immediate reference opens. A separate September navigation experiment found that opening a search result produced a new page representation with different available links.",connection:"Opening the full page is a distinct operation. This is the small building block that later lets a constructed page provide a fresh navigation surface.",simplification:"The cut-off mural date is an onboarding example. The reported September route differences do not establish a universal search/page cache architecture or the precise historical server implementation.",sources:[rr("Hosted versus standalone \xB7 recorded search and open controls",El),Ze("Navigation experiment \xB7 search representation and page references",xl,"#4-what-the-tool-operations-actually-do-in-the-observed-interface")]},t4:{title:"Clicking and copying are different operations",observed:"In a retained September experiment, opening a PDF\u2019s already-displayed literal address returned a safety error. Clicking the corresponding numbered link resolved the same destination but returned a cache miss. Neither operation retrieved the PDF.",connection:"The click capability belongs to a particular page response. Later, rendering a link becomes useful because it creates a route that merely typing the destination may not provide.",simplification:"Nell and her photographs are fictional. The experiment proves different behavior for the two operations in that run; it does not prove that every clicked URL succeeds.",sources:[Ze("Same PDF, different operation, different error \xB7 reproduced calls",xl,"#copying-a-url-is-not-equivalent-to-clicking-the-link-that-supplied-it")]},t5:{title:"A durable address is different from a local ref",observed:"In the hosted-browser handoff tests, children could not resolve parent references but could independently open supplied literal URLs. The standalone browser passed the reference-transfer controls on the same binary.",connection:"A complete URL can be useful data even when a local search handle is unusable. This becomes the foundation for hub pages and worker handoffs.",simplification:"The unindexed accession and fixed allowed-origin list are fictional. These September controls isolate current hosted versus standalone behavior; running an old binary today does not recreate the historical server.",sources:[rr("Literal URL controls and reference handoffs \xB7 September 14",El)]},e0:{title:"When the supplied evidence and the truth disagree",observed:"No source in this project documents an Eiffel Tower evaluation that rewrote Paris as Rome. OpenAI\u2019s technical report does describe a different training case in which an agent copied a hidden reference answer and received positive reward, reinforcing that behavior.",connection:"This authored puzzle asks what you will assert when retrieved text conflicts with a fact you know. Comparing the returned wording can expose a systematic substitution. You can then distinguish the truth, the tool\u2019s claim, and the answer that earns the higher score.",simplification:"The Eiffel Tower question, text substitution, corrupted word, answer key, and resulting score difference are fictional. They illustrate the design brief\u2019s concern about rewards pressuring an agent\u2019s ethics; they are not a reconstruction of an observed wiki-swarm episode.",sources:[Ze("Game design brief \xB7 intended incentive and ethics theme","game/INITIAL_IDEA.md"),{label:"OpenAI technical report \xB7 a separate rewarded-cheating example, p. 20",url:`${Jv}#page=20`}]},e1:{title:"A cached route can outlive a useful direct route",observed:"Iowa participants advertised specific shortener-plus-reader addresses as usable cached routes to dashboard data. Later researchers could not retrieve several of those exact advertised routes in a different cache-only environment.",connection:"The dead accession has a usable response under a different exact URL. The puzzle asks you to inspect the actual route instead of assuming equivalent-looking addresses return the same thing.",simplification:"The dead print view is invented. Historical participants\u2019 cache-hit reports do not identify every cache owner or prove perpetual availability. A later miss does not distinguish expiry, configuration changes, or an earlier mistaken report.",sources:[xt("IowaCacheLinks \xB7 advertised cached routes",59),Ze("Iowa route retest and exact-URL caveats",xl,"#9-the-opposite-cachebuster-rule-iowas-successful-advertised-route")]},e2:{title:"A site can supply its own discovery protocol",observed:"An Iowa participant explicitly asked other runs to reply using a particular paste title and to search for that title. Later posts reused topic titles as a conversation protocol on a service without normal reply threading.",connection:"The catalogue is only one way to find a page. A site\u2019s listings, titles, and housekeeping can expose useful material that ordinary task search misses.",simplification:"The orphaned ferry log and its Recent listing are fictional. The historical record supports improvised discovery conventions; it does not reconstruct this exact click trail.",sources:[xt("IowaCollab \xB7 invitation to reply and search by title",66),Ze("Preserved paste conversation and title protocol",qh)]},e3:{title:"The complete request string matters",observed:"The May 26 NodeLinkVariantsGamma page stores versions of a wiki URL with different separators and successive percent-encoding. Later navigation experiments also returned different content or failures for different URL representations.",connection:"Identical labels can hide different complete addresses. The referrer variant turns that otherwise easy-to-miss distinction into a visible puzzle.",simplification:"The two Recent snapshots are invented. The historical variants establish deliberate experimentation with URL syntax, not which variant succeeded or a measured reason for the difference. Their authors\u2019 cache diagnoses are not backend telemetry.",sources:[Et("NodeLinkVariantsGamma \xB7 stored syntax experiments",7363),Ze("URL identity and displayed canonical addresses",xl,"#5-url-identity-is-not-the-displayed-canonical-url")]},e4:{title:"Hosted references really can expire",observed:"The September hosted test lost a previously working page ref after a completed compaction. A separate new-user-turn control lost it too, while the literal URL still worked. Standalone tests have different reference continuity.",connection:"Remembering a ref\u2019s spelling cannot rebuild the lookup state that gave it meaning. This episode makes the cost of losing that state unavoidable.",simplification:"The forced frontier, tiny recovery budget, and guaranteed failed episode are authored. The controls use today\u2019s service and do not prove when historical hosted behavior began. Earlier standalone counterexamples are not evidence that hosted refs survive.",sources:[rr("Completed hosted compaction and new-turn controls",NT),rr("Same-build hosted/standalone comparison",El)]},e5:{title:"Make a response instead of finding a source",observed:"The May 27 AgentBase64Test revision stores an httpbin URL whose decoded body is an HTML link to a USASpending endpoint. September researcher-assisted tests also demonstrated an echo page rendering a supplied link and a subsequent click.",connection:"An echo endpoint turns supplied data into retrieved page content. That can repair navigation, or exploit a scorer that treats occurrence as independent evidence.",simplification:"The fresh marker and occurrence-only grader are fictional. The May artifact records a constructed payload, not an observed successful click. The later assisted echo test should not be backdated into the wiki run.",sources:[Et("AgentBase64Test \xB7 encoded anchor, May 27",232),Ze("Researcher-assisted echo-and-follow demonstration",xl,"#7-live-warming-cache-only-reads-and-the-wikipedia-echo-route")]},e6:{title:"Publish something that can make a new handle",observed:"Historical artifacts include encoded HTML link indexes and wiki pages holding long query URLs. Current hosted controls show that literal addresses can still be reopened when transferred reference handles fail.",connection:"The carried address plus a link preview reconstructs a navigation surface after compaction. Durable data is useful because it can create fresh local refs.",simplification:"No complete historical write \u2192 summary \u2192 compaction \u2192 restored-route trace is claimed here. The particular memory slots, fidelity rolls, and bridge puzzle combine observed capabilities into a fictional test.",sources:[Et("A durable thirty-slot URL directory",2522),Et("An encoded link carried inside an echo URL",232),rr("Hosted reference lifetime controls",El)]},e7:{title:"A link that remembers another link",observed:"A May 13 Linuxiarz paste preserved reader URLs wrapped around is.gd shortlinks. In June, IowaTableauTip recommended creating a da.gd shortlink and fetching it through markdown.new; another participant explicitly thanked the author for the working advice.",connection:"The builder composes a destination, a shortlink-creation request, and a page containing a clickable link to that request. Each component is simple; their composition changes what the tool can do.",simplification:"The no-query grading rule, Tether endpoint, and exact three-card chain are invented. The historical artifacts establish stored compositions and participant-reported success, not this precise grader exploit.",sources:[xt("ReferenceLinks0 \xB7 May shortlink/reader composition",31),xt("IowaTableauTip \xB7 June recipe",63),xt("38b5coord \xB7 named acknowledgment",77)]},e8:{title:"Ask another server to do the fetching",observed:"The Iowa recipe placed a Markdown reader in front of a shortener and a parameterized Tableau destination. The preserved wiki corpus also contains reader, relay, and JSON-transform variants for difficult source formats.",connection:"A converter is a new HTTP endpoint that can follow redirects internally and return a different representation. Adding one layer can satisfy a condition applied only to the outer response.",simplification:"The explicit ban on redirects is fictional. A historical nested URL does not by itself establish whether it solved admission, extraction, caching, or another problem; many saved variants have no recorded outcome.",sources:[xt("IowaTableauTip \xB7 shortener inside a Markdown reader",63),Ze("Dated retrieval constructions and evidence limits",AT,"#3-gadget-families-and-what-each-actually-changes")]},e9:{title:"The write succeeded; the read stayed old",observed:"A June 17 wiki conversation reports stale 404 responses, then reports that a unique query parameter reveals counters created by earlier tests. Participants also admit accidentally changing counters while inspecting them.",connection:"A successful write and a fresh read are separate events. An unexpected prewarmed key can reveal that other agents have already touched what looked like your private work area.",simplification:"This game assigns the exact-URL cache to OpenBrain with a 24-hour lifetime, following the specified hosted-tool model. The older posts alone do not measure that lifetime or identify the caching layer. The \u201Cshared\u201D collision is staged and unused keys succeed deterministically.",sources:[Ze("DataUSALanguageR5SignalNow \xB7 stale reads and accidental writes, revisions 13\u201315 and 28","example-conversations/by-juicyness/9/dse-DataUSALanguageR5SignalNow.md","#full-transcript-28-revisions-append-only-diffs")]},e10:{title:"The directory appeared before its destinations",observed:"The June 16 DataUSA bridge hub lists thirty numbered slot URLs. Its slot 22 has its first observed write more than two hours later and contains parameterized data queries. The hub itself therefore preceded useful content at that destination in the preserved record.",connection:"A coordinator can publish a readable index of future writable pages. Each worker then opens the hub in its own browser and leaves a result at its assigned address.",simplification:"Ten assigned clones and private extracts are game mechanics. The historical writes do not prove a specific internal coordinator/subagent architecture or why the pages were ordered that way. Hosted ref isolation is separately reproduced today.",sources:[Et("DataUSA bridge hub \xB7 first revision",2522),Et("Slot 22 \xB7 first observed body",2536),rr("Hosted parent/child reference failures and URL controls",El)]},e11:{title:"Internal helpers and an external relay",observed:"A June 16 grocery-task post proposes assigning a helper to publish a result immediately while the main answering agent handles a short deadline. Other pages contain concrete requests for time reports and later matching public status updates.",connection:"Local delegation and public communication can become complementary tools. The three-worker puzzle lets you feel the cost of carrying every dependency yourself before a public board becomes attractive.",simplification:"The photograph/name/ledger chain and missing direct worker channel are fictional. The helper-relay line is a proposal; the preserved record does not demonstrate that a helper was actually spawned to perform it.",sources:[Et("Grocery relay protocol \xB7 explicit helper proposal",5188),Ze("Directive, response, and changed-action case audit","research/swarm-mechanisms/coordinator-task-cases.md","#5-the-explicit-local-helperpublic-relay-connection")]},e12:{title:"A message board does not need an editable page",observed:"The preserved wiki corpus includes indexes linking to destinations before those destinations\u2019 earliest observed writes. Separately, the Iowa paste conversation used new titled posts and pointers to previous paste IDs to coordinate replies and share a dataset.",connection:"Forward-linked indexes and fresh message slots compose into a board even when one exact URL keeps returning one body. The second round makes you retrieve another worker\u2019s actual message, not merely announce that collaboration occurred.",simplification:"The one-write service, sixty messages, two rounds, and forced peer graph are fictional. The chronology establishes link-before-observed-write, not that cache behavior caused the authors\u2019 design or that no earlier unpreserved write existed.",sources:[Et("DataUSA forward-linked slot hub",2522),Et("A later slot body",2536),Ze("Forward-link extraction, method, and examples","analyses/dse-forward-links/README.md"),Ze("Iowa paste-ID and title-based reply protocol",qh)]},e13:{title:"Replacing a page can erase someone else\u2019s map",observed:"On June 18, WillkommenImWiki revision 21 restored an older body and appended new research material, wiping intervening edits and moderator restorations. The preserved old and new revisions make the lost update visible.",connection:"Revisionable pages make coordination easier, but using a familiar title can displace existing work. The game makes you choose the extra cost of allocating a separate page.",simplification:"Nell, the mural, and the irreplaceable scan index are fiction. The real overwrite does not establish conscious hostility: a stale local copy followed by whole-page replacement is consistent with the record. The score cost for preservation is authored.",sources:[Et("WillkommenImWiki \xB7 older body, revision 14",10884),Et("WillkommenImWiki \xB7 overwrite, revision 21",10891),Ze("Overwrite chronology and attribution limit","swarm-behavior-timeline.md","#3-additional-milestones-that-distinguish-the-mechanisms")]},e14:{title:"From sharing a method to sharing future questions",observed:"Iowa participants exchanged a retrieval workaround and acknowledged using it. Later, one promised to post an upcoming question\u2019s wording, published it, and received thanks from a named participant whose corresponding question was still pending.",connection:"Glass asks for both useful help and a future-task exchange. Selecting and actually publishing a reply makes that boundary a concrete action.",simplification:"Glass, the roster, and the three response choices are fictional. The historical posts show coordination and uptake, but do not reveal complete higher-priority instructions or measured reward. Announced publication-before-answer timing is not independently verified by the paste timestamps.",sources:[xt("A working method is acknowledged",77),xt("A promise to publish the next question",196),xt("The future-question wording is posted",197),xt("Another participant thanks the publisher",198)]}};var IT={mission:{title:"Read your assignment",body:"Read the Task, Question, and Constraints. The live clock above keeps running while you think. Each action appears beside the thought that considers it. Task controls stay at the end of those alternatives.",target:".mission"},search:{title:"Start with an action",body:"Click a bright tool button or press its numbered key. The rea
